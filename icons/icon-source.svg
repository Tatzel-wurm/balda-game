<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="128" y1="80" x2="896" y2="944" gradientUnits="userSpaceOnUse">
      <stop stop-color="#254F49"/>
      <stop offset="1" stop-color="#173B38"/>
    </linearGradient>
    <linearGradient id="selected" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#3E7769"/>
      <stop offset="1" stop-color="#2C6258"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFDF7"/>
      <stop offset="1" stop-color="#F2EBDD"/>
    </linearGradient>
    <filter id="boardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0B2422" flood-opacity=".42"/>
    </filter>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#162D2A" flood-opacity=".3"/>
    </filter>
  </defs>

  <!-- Full-bleed background stays attractive under iOS and Android icon masks. -->
  <rect width="1024" height="1024" rx="224" fill="url(#background)"/>
  <circle cx="182" cy="154" r="250" fill="#FFFFFF" opacity=".025"/>
  <circle cx="892" cy="882" r="300" fill="#071F1D" opacity=".08"/>

  <!-- A compact 5 × 5 board based on the in-game word path. -->
  <g filter="url(#boardShadow)">
    <rect x="112" y="112" width="800" height="800" rx="92" fill="#D8CFBE"/>
    <rect x="128" y="128" width="768" height="768" rx="76" fill="#E5DDCF"/>
  </g>

  <!-- Empty cells. -->
  <g fill="#EEE8DC">
    <rect x="144" y="144" width="136" height="136" rx="30"/><rect x="294" y="144" width="136" height="136" rx="30"/><rect x="444" y="144" width="136" height="136" rx="30"/><rect x="594" y="144" width="136" height="136" rx="30"/><rect x="744" y="144" width="136" height="136" rx="30"/>
    <rect x="144" y="294" width="136" height="136" rx="30"/><rect x="444" y="294" width="136" height="136" rx="30"/><rect x="594" y="294" width="136" height="136" rx="30"/><rect x="744" y="294" width="136" height="136" rx="30"/>
    <rect x="144" y="594" width="136" height="136" rx="30"/><rect x="294" y="594" width="136" height="136" rx="30"/><rect x="444" y="594" width="136" height="136" rx="30"/><rect x="594" y="594" width="136" height="136" rx="30"/><rect x="744" y="594" width="136" height="136" rx="30"/>
    <rect x="144" y="744" width="136" height="136" rx="30"/><rect x="294" y="744" width="136" height="136" rx="30"/><rect x="444" y="744" width="136" height="136" rx="30"/><rect x="594" y="744" width="136" height="136" rx="30"/><rect x="744" y="744" width="136" height="136" rx="30"/>
  </g>

  <!-- Built word: БАЛДА. -->
  <g filter="url(#tileShadow)" fill="url(#paper)">
    <rect x="144" y="444" width="136" height="136" rx="30"/><rect x="294" y="444" width="136" height="136" rx="30"/><rect x="444" y="444" width="136" height="136" rx="30"/><rect x="594" y="444" width="136" height="136" rx="30"/><rect x="744" y="444" width="136" height="136" rx="30"/>
  </g>

  <!-- New vertical path and the active cell. -->
  <g filter="url(#tileShadow)" fill="url(#selected)">
    <rect x="294" y="144" width="136" height="136" rx="30"/>
    <rect x="294" y="294" width="136" height="136" rx="30"/>
    <rect x="294" y="444" width="136" height="136" rx="30"/>
  </g>
  <rect x="287" y="137" width="150" height="150" rx="38" fill="none" stroke="#E5A93F" stroke-width="14"/>

  <!-- Letterforms use a bundled system serif and remain legible at 192 px. -->
  <g font-family="DejaVu Serif, Georgia, serif" font-size="82" font-weight="700" text-anchor="middle" dominant-baseline="central">
    <g fill="#173B38">
      <text x="212" y="515">Б</text><text x="512" y="515">Л</text><text x="662" y="515">Д</text><text x="812" y="515">А</text>
    </g>
    <g fill="#FFFDF7">
      <text x="362" y="215">Э</text><text x="362" y="365">Ф</text><text x="362" y="515">А</text>
    </g>
  </g>
  <circle cx="844" cy="180" r="13" fill="#E5A93F"/>
  <path d="M844 153v54M817 180h54" stroke="#FFF7E8" stroke-width="7" stroke-linecap="round" opacity=".92"/>
</svg>
